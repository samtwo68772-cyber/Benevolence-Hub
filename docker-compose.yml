
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benevolence_app
    ports:
      - "9002:9002"
    environment:
      - DATABASE_URL=mysql://benevolence_user:benevolence_password@mysql:3306/benevolence_hub
      - NODE_ENV=development
      - PORT=9002
      - SESSION_SECRET=${SESSION_SECRET:-your_session_secret_here}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        /app/wait-for-it.sh mysql:3306 -t 60 -- echo 'Database is up!' &&
        npx prisma migrate deploy &&
        npx prisma generate &&
        npx prisma db seed &&
        npm run build &&
        npm start
      "

  mysql:
    image: mysql:8.0
    container_name: benevolence_db
    environment:
      MYSQL_DATABASE: benevolence_hub
      MYSQL_USER: benevolence_user
      MYSQL_PASSWORD: benevolence_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "benevolence_user", "-pbenevolence_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
