
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benevolence_app
    ports:
      - "9002:9002"
    environment:
      - DATABASE_URL=postgresql://benevolence_user:benevolence_password@postgres:5432/benevolence
      - DATABASE_URL_POOLED=postgresql://benevolence_user:benevolence_password@postgres:5432/benevolence?pg-bouncer=true
      - NODE_ENV=development
      - PORT=9002
      - SESSION_SECRET=${SESSION_SECRET:-your_session_secret_here}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        /app/wait-for-it.sh postgres:5432 -t 60 -- echo 'Database is up!' &&
        npx prisma migrate deploy &&
        npx prisma generate &&
        npx prisma db seed &&
        npm run build &&
        npm start
      "

  postgres:
    image: postgres:latest
    container_name: benevolence_db
    environment:
      POSTGRES_DB: benevolence
      POSTGRES_USER: benevolence_user
      POSTGRES_PASSWORD: benevolence_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benevolence_user -d benevolence"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
